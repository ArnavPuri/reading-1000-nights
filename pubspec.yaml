name: thousand_nights
description: "1000 Nights: one story, one poem, one essay every night for 1000 nights."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    - assets/packs/
    - assets/packs/pack-001/images/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: NewsreaderDisplay
      fonts:
        - asset: assets/fonts/NewsreaderDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/NewsreaderDisplay-Regular.ttf
